# Grupo props-rpg — armas, ferramentas e cristais do Coro (Ofício Talhado & Iluminura Rural).
# Props de terreno partilhados (rock_mossy) estão em manifests/props.yaml.
# Defs base em ../game.yaml e ../docs/ART.md.
# Regenerar: gameassets resume --profile game.yaml --manifest manifests/props-rpg
output_dir: ../public/assets
meshes_subdir: meshes/props
images_subdir: images/props
assets:
  - id: sword_hero
    seed: 44102
    idea:
      hand-forged rural broadsword standing perfectly upright vertical on its pommel, tip
      pointing straight up, flat chamfered wrought-steel blade with sharpened edge bevels,
      plain forged iron and aged-brass crossguard, leather-wrapped grip and faceted turquoise
      Choir crystal pommel at bottom on ground, front view, not tilted not diagonal not lying
      on side, matte tempera finish with clean sharpened edge, hero weapon, clean simple
      silhouette
    kind: prop
    category: weapon
    pipeline:
      - 3d
      - paint
      - collision
    omni:
      control_type: bbox
      size_m:
        - 0.12
        - 1.0
        - 0.04
  - id: axe
    seed: 77419
    idea:
      hand-forged battle axe standing perfectly straight vertical like a plumb line, chamfered
      ash-wood handle butt on ground with worn leather grip wrap, heavy forged dark iron axe
      head centered at very top with wide flat chamfered cutting bevel, orthographic front
      view, zero tilt zero lean, not diagonal not sideways, matte gouache and tempera finish,
      white background, hero weapon
    kind: prop
    category: weapon
    pipeline:
      - 3d
      - paint
      - collision
    omni:
      control_type: bbox
      size_m:
        - 0.35
        - 0.9
        - 0.05
  - id: spear
    idea:
      hand-forged leaf-bladed hunting and guard spear with chamfered steel tip and sturdy
      hand-hewn ash-wood shaft, visible shaft thickness, worn stitched leather grip wrap,
      matte gouache and tempera finish in smoked wood and forged iron, hero weapon, clean
      simple design, proportions readable at game distance
    kind: prop
    category: weapon
    pipeline:
      - 3d
      - paint
      - collision
    omni:
      control_type: bbox
      size_m:
        - 0.14
        - 1.65
        - 0.14
    # A haste é mais fina que o voxel merge por omissão (N=0.24) — o
    # morph-close derretia a lança inteira no clean (shape 743 KB → 49 KB).
    # Merge suave: sela micro-rachas sem engrossar/perder a haste.
    text3d:
      morph_close_voxels: 0.08
  - id: felling_axe
    seed: 90612
    idea:
      rural woodcutting felling axe standing perfectly upright vertical, long chamfered oak
      handle butt on ground worn smooth at the grip, large curved forged dark iron chopping
      blade head at top with sharpened bevel like a woodsman axe not a knife not a dagger,
      flat thin blade profile, orthographic front view, zero tilt, matte gouache and tempera
      finish, white background, logging tool
    kind: prop
    category: tool
    pipeline:
      - 3d
      - paint
      - collision
    omni:
