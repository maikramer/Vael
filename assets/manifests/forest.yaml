# Grupo forest — vegetação e construções da Floresta Sombria (Ofício Talhado & Iluminura Rural).
# Defs base em ../game.yaml e ../docs/ART.md.
# Regenerar: cd assets && gameassets resume --profile game.yaml --manifest manifests/forest
output_dir: ../public/assets
meshes_subdir: meshes/forest
images_subdir: images/forest
assets:
  - id: pine_dark
    idea:
      tall dark-forest pine tree with dense layered foliage masses in deep pine-black and
      moss-green, narrow chamfered dark bark trunk, matte gouache and tempera finish with
      broad clean color blocks, Floresta Sombria conifer tree
    kind: environment
    category: vegetation
    pipeline:
      - 3d
      - paint
      - lod
      - collision
    lod_levels: 2
    omni:
      control_type: bbox
      bbox_preset: tree
      size_m:
        - 2.0
        - 9.0
        - 2.0
  - id: dead_tree
    seed: 44119
    idea:
      bare dead forest tree with wide silhouette in front view, broad angular trunk with
      carved chamfered bark planes and thick leafless branches spanning left-right, shallow
      depth front-to-back not a deep volume, weathered lichen-grey bark, matte gouache and
      tempera finish, full body visible, three-quarter front view
    kind: environment
    category: vegetation
    pipeline:
      - 3d
      - paint
      - lod
      - collision
    lod_levels: 2
    omni:
      control_type: bbox
      size_m:
        - 2.5
        - 7.0
        - 1.7
  - id: mushroom_glow
    idea:
      tall forest mushroom with slender chamfered stalk and faceted cap emitting a soft
      turquoise-cyan Choir luminescence, dark moss at base, matte gouache and tempera finish
      with broad clean color zones, upright prop on dark forest floor, narrow footprint
    kind: prop
    category: vegetation
    pipeline:
      - 3d
      - paint
      - lod
      - collision
    # Cogumelo baixo (0.55 m): split global cut_height=0.6 falha; não é árvore.
    text3d:
      split_at_height: false
    omni:
      control_type: bbox
      height_m: 0.55
      footprint_m: 0.35
  - id: witch_hut
    # Refeito na review visual de 2026-10-23. A versão de colmo dava sempre o
    # telhado a tapar as paredes (3 seeds); a referência nova é uma casa alta
    # de enxaimel com telhado curto em chapéu de bruxa (text2d seed 7002).
    seed: 40424
    idea:
      tall narrow two-storey crooked forest witch dwelling with crisp chamfered hand-hewn
      dark pine timber frame and weathered lichen-slate plaster walls clearly visible on
      every side, steep pointed roof of dark slate shingles with small overhang, warm amber
      window glow, heavy plank door with wrought-iron hinges and carmine cloth talisman
      ribbons, cold stone chimney without smoke, mossy squared stone base flush to ground,
      matte gouache and tempera finish in broad clean color blocks
    kind: environment
    category: building
    pipeline:
      - 3d
      - paint
      - lod
      - collision
    omni:
      control_type: bbox
      bbox:
        - 0.75
        - 1.0
        - 0.75
      size_m:
        - 4.5
        - 6.0
        - 4.5
    # O xatlas abre um chart por aresta viva desta casa de enxaimel: a 262k
    # faces passa dos 180 s (bounded). A 60k o unwrap fecha em ~88 s e o LOD0
    # final (~29k) não perde detalhe útil (a textura carrega-o).
    paint3d:
      to_paint_faces: 60000
      # Bake com mais cobertura: 6 vistas @512 deixavam 24% de trust (o atlas
      # do edifício cobre muito interior) e o inpaint fazia mosaico. 8 vistas
      # @640 + bake_exp 6 (perfil) aproximam o trust dos outros edifícios.
      max_views: 8
      view_resolution: 640
  - id: tree_oak
    idea:
      valley oak tree with broad sculpted canopy of layered olive and meadow-green foliage
      masses on a thick chamfered brown bark trunk with exposed roots, matte gouache and
      tempera finish in broad clean color blocks
    kind: environment
    category: vegetation
    pipeline:
      - 3d
      - paint
      - lod
      - collision
    omni:
      control_type: bbox
      bbox:
        - 0.5
        - 1.0
        - 0.5
      size_m:
        - 4.0
        - 8.0
        - 4.0
  - id: tree_pine
    idea:
      tall valley pine tree with layered triangular foliage masses in deep sage and forest
      green, straight chamfered umber bark trunk, matte gouache and tempera finish with broad
      clean color blocks
    kind: environment
    category: vegetation
    pipeline:
      - 3d
      - paint
      - lod
      - collision
    omni:
      control_type: bbox
      bbox_preset: tree
      size_m:
        - 2.0
        - 9.0
        - 2.0
