# Pack audio-ambience — loops contínuos de ambiente (Stable Audio 3 Small
# Music, kind ambient_loop via category environment). Sem música, sem melodia:
# água, chuva, fogo e camas de bioma. O volume é do jogo (distância/mixer).
#
# Caminhos fixos consumidos pela engine: world/water_{lake,flow,waterfall} e
# ambient/rain_loop (Viber/src/ambient.rs::AMBIENT_LOOP_FILES). Os restantes
# são pedidos por scripts com `viber.sound_loop(..., { bus = "ambience" })`.
# Regenerar: cd assets && python3 regen_audio.py --only sfx/ambient,sfx/world/water --force
output_dir: ../public/assets
meshes_subdir: meshes/audio
images_subdir: images/audio
assets:
  - id: sfx/world/water_lake
    idea: Quiet lake water lapping on a sandy shore, small soft waves, calm slow ripples, serene nature ambience, no music, no melody
    kind: environment
    category: environment
    pipeline:
      - audio
    audio:
      duration: 16
      profile: music
    seed: 610
  - id: sfx/world/water_flow
    idea: Calm forest river flowing over smooth rocks, clear stream babbling gently, soft continuous water ripples, peaceful nature ambience, no music, no melody
