# Pack audio-ambience — loops contínuos de ambiente (Stable Audio 3 Small
# Music ou SFX, kind ambient_loop via category environment). Sem música, sem melodia:
# água, chuva, fogo e camas de bioma. O volume é do jogo (distância/mixer).
#
# Caminhos fixos consumidos pela engine: world/water_{lake,flow,waterfall} e
# ambient/rain_loop (Viber/src/ambient.rs::AMBIENT_LOOP_FILES). Os restantes
# são pedidos por scripts com `viber.sound_loop(..., { bus = "ambience" })`.
# Regenerar: cd assets && python3 regen_audio.py --only sfx/ambient,water_lake,water_flow,water_waterfall --force
output_dir: ../public/assets
meshes_subdir: meshes/audio
images_subdir: images/audio
assets:
  - id: sfx/world/water_lake
    idea: Field recording beside a sheltered freshwater lake. Small rounded waves gently lap against pebbles, hollow little plops at irregular intervals, calm water in the foreground, steady quiet shoreline.
    kind: environment
    category: environment
    pipeline:
      - audio
    audio:
      duration: 16
      profile: effects
      seamless_loop: true
    seed: 810
  - id: sfx/world/water_flow
    idea: Calm forest river flowing over smooth rocks, clear stream babbling gently, soft continuous water ripples, peaceful nature ambience, no music, no melody
    kind: environment
    category: environment
    pipeline:
      - audio
    audio:
      duration: 16
      profile: music
    seed: 611
  - id: sfx/world/water_waterfall
    idea: Powerful waterfall plunging into a misty plunge pool, thundering falling water with deep rumble and white spray, continuous roar from start to end, steady energy through the loop point, no outro, no fade, no music, no melody
    kind: environment
    category: environment
    pipeline:
      - audio
    audio:
      duration: 16
      profile: music
    seed: 7000
  - id: sfx/ambient/rain_loop
    idea: Steady rain falling on leaves and stone, soft continuous rainfall with a distant thunder rumble, steady from start to end, no outro, no fade, no music, no melody
    kind: environment
    category: environment
    pipeline:
      - audio
    audio:
      duration: 16
      profile: music
    seed: 4613
