# Grupo farm — alvos de recolha e identidade rural do Vale (Ofício Talhado & Iluminura Rural).
# Defs base em ../game.yaml e ../docs/ART.md.
#
# `category` + `size_m` bastam: o bbox_tune escolhe o octree a partir do
# char_m, e o soft-fill do Omni preenche control_type/presets por categoria.
# Não fixar `octree_resolution` aqui (ver docs/MANIFEST_AUTHORING.md §1).
#
# Regenerar: gameassets resume --profile game.yaml --manifest manifests/farm
output_dir: ../public/assets
meshes_subdir: meshes/farm
images_subdir: images/farm
assets:
  # ── Alvos de recolha ────────────────────────────────────────────────
  # Par frutífero: a MESMA descrição e o MESMO seed; a única diferença é a
  # cláusula das bagas. A versão `bare` é a árvore que fica depois da colheita
  # (o harvest.lua troca uma pela outra), por isso as duas têm de ser a mesma
  # árvore. Não separar as descrições: é isso que mantém a silhueta alinhada.
  - id: berry_bush
    seed: 51101
    idea:
      one single small rural valley orchard tree, about two meters tall, sturdy short
      chamfered warm-umbrian bark trunk with two low forked roots gripping the soil, trunk
      splitting into a few short branches, broad rounded crown of large layered foliage
      masses in deep olive and meadow green, dense even canopy covering every branch, many
      small clusters of ripe madder-red berries hanging between the leaves all around the
      crown, perfectly centered front view, whole tree visible from roots to crown top,
      plain pure white background, no ground plane, no grass, no cast shadow, crisp clean
      silhouette, matte gouache and tempera finish in broad clean color blocks
    kind: environment
    category: vegetation
    pipeline: [3d, paint, lod, collision]
    omni:
      control_type: bbox
      size_m: [1.2, 1.5, 1.2]

  - id: berry_bush_bare
    seed: 51102
    idea:
      one single small rural valley orchard tree, about two meters tall, sturdy short
      chamfered warm-umbrian bark trunk with two low forked roots gripping the soil, trunk
      splitting into a few short branches, broad rounded crown of large layered foliage
      masses in deep olive and meadow green, dense even canopy covering every branch, every
      branch covered in plain layered green foliage with no berries and no fruit on the tree,
      perfectly centered front view, whole tree visible from roots to crown top, plain pure
      white background, no ground plane, no grass, no cast shadow, crisp clean silhouette,
      matte gouache and tempera finish in broad clean color blocks
    kind: environment
    category: vegetation
    pipeline: [3d, paint, lod, collision]
    omni:
      control_type: bbox
      size_m: [1.2, 1.5, 1.2]

  - id: ore_vein
    seed: 51107
    idea:
      angular chamfered quarry boulder of dark slate-grey rock with oxidized copper-ochre and
      dull wrought-iron ore seams running through the fractured facets, a couple of loose
      faceted ore chunks at the foot, matte gouache and tempera finish in broad clean color
      blocks, white background
    kind: environment
    category: terrain
    pipeline: [3d, paint, lod, collision]
    omni:
      control_type: bbox
      size_m: [1.6, 1.3, 1.5]

  - id: flint_rock
    seed: 51113
    idea:
      low cluster of three sharp knapped flint stones resting on the ground, crisp chamfered
      chipped dark slate and pale chalk edges, matte mineral tempera finish, white background
    kind: prop
    category: terrain
    pipeline: [3d, paint, lod, collision]
    omni:
      control_type: bbox
      size_m: [0.6, 0.3, 0.55]

  # ── Identidade de quinta ────────────────────────────────────────────
  # As cercas (`fence_segment`, `fence_gate`) saíram do pool a 2026-11-23: o
  # mundo autora linhas e o `bevy_ext_fence` gera-as (`tools/fence_migrate.py`,
  # docs/FENCES.md). As texturas das madeiras são de `manifests/wood-textures.yaml`.

  - id: scarecrow
    seed: 51131
    idea:
      rural field scarecrow standing upright on a single chamfered wooden post, dry golden-ochre
      straw stuffed under a mended coarse linen tunic, burlap sack head with simple charcoal
      stitched marks, wide-brimmed felt work hat, outstretched wooden cross-arm, matte gouache
      and tempera finish in broad clean color blocks, white background
    kind: environment
    category: prop
    pipeline: [3d, paint, lod, collision]
    omni:
      control_type: bbox
      size_m: [1.4, 2.2, 0.4]

  - id: hay_bale
    seed: 51137
    idea:
      tightly bound rural hay bale cylinder lying on its side, carved chamfered straw bundles
      in warm dry ochre and raw sienna tied with thick hemp rope, matte gouache and tempera
      finish in broad clean color zones, white background
    kind: prop
    category: prop
    pipeline: [3d, paint, lod, collision]
    omni:
      control_type: bbox
      size_m: [1.4, 1.1, 1.4]

  - id: chicken_coop
    seed: 51141
    idea:
      rural wooden poultry coop hut on short chamfered oak stilts with a sloped dark-slate
