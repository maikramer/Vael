# Grupo characters-extra — variantes de criaturas (Ofício Talhado & Iluminura Rural).
output_dir: ../public/assets
meshes_subdir: meshes/characters
images_subdir: images/characters
assets:
- id: shade
  idea:
    battlefield shadow soldier figure made of wet dark basalt and charcoal-ash with
    carved chamfered planes, weathered military tunic ending above the knees with
    distinct separate legs and boots, sharp clearly sculpted working hands and forearms
    tinged with a faint muted turquoise crystal trace, matte mineral tempera finish,
    standing upright in relaxed A-pose with both arms straight and angled down at 45
    degrees away from the body, legs straight and slightly apart, feet shoulder-width
    apart, clear gap between the legs from thighs to feet, relaxed open hands with
    fingers held together and palms facing the thighs, hands empty, no weapons, no
    props, full body visible, front-facing
  kind: character
  category: creature
  pipeline:
  - 3d
  - paint
  - rig
  - animate
  - lod
  - collision
  lod_levels: 1
  animate:
    preset: humanoid
    force_preset: true
    clips: idle,walk,run,jump,attack,zombieidle,zombiewalk,hit,death
  omni:
    control_type: pose
    pose_preset: quaternius-apose
    size_m:
    - 0.6
    - 1.6
    - 0.4
- id: bog_warden_boss
  idea:
    colossal swamp guardian boss constructed of heavy angular bog-peat blocks, tarred
    shipwreck timber planks, tangled mangrove roots and dark mud planes, with a fractured
    glowing turquoise-blue Choir crystal core embedded inside its open chest cavity,
    matte gouache and tempera finish with broad clean color blocks in dark mire, reed-olive
    and turquoise crystal, standing upright in relaxed A-pose with both arms straight and
    angled down at 45 degrees away from the body, legs straight and slightly apart, feet
    shoulder-width apart, clear gap between the legs from thighs to feet, visible gap
    between arms and torso, relaxed open hands with fingers held together and palms facing
    the thighs, hands empty, no weapons, no props, full body visible, front-facing
  kind: character
  category: creature
  pipeline:
  - 3d
  - paint
  - rig
  - animate
  - lod
  - collision
  lod_levels: 1
  generation: high
  animate:
    preset: humanoid
    force_preset: true
    clips: idle,walk,jump,attack,hook,swordheavy,hit,knockback,death,roar
  omni:
    control_type: pose
    pose_preset: quaternius-apose
    size_m:
    - 1.4
    - 2.6
    - 1.0
