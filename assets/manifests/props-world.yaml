# Grupo worldprops — estruturas de trabalho, travessia e acampamento (Ofício Talhado & Iluminura Rural).
# Consumidos por URL/prefab no mundo. Defs base em ../game.yaml e ../docs/ART.md.
# Regenerar: cd assets && gameassets resume --profile game.yaml --manifest manifests/props-world
output_dir: ../public/assets
meshes_subdir: meshes/props
images_subdir: images/props
assets:
  - id: banner_stand
    idea:
      tall hand-hewn timber banner stand, single thick chamfered oak pole planted in a low
      squared stone plinth with lime wash, short horizontal cross arm at the top, long
      rectangular coarse wool banner hanging from the arm in deep madder-carmine and ochre
      with a simple carved Choir emblem, matte gouache and tempera finish in broad clean
      color blocks, white background, straight front view
    kind: environment
    category: prop
    pipeline: [3d, paint, lod, collision]
    omni:
      control_type: bbox
      size_m: [1.6, 4.8, 1.2]
  - id: hand_cart
    seed: 70201
    idea:
      rural wooden hand cart, one single clean open rectangular cargo box built of straight
      chamfered oak planks with four forged black wrought-iron corner brackets, two round
      spoked wooden wheels on a straight iron axle at the back, two straight pull shafts
      pointing forward low to the ground with grips worn smooth on one side, empty open top,
      simple clean silhouette, no canopy, no lid, weathered smoked-oak timber, matte gouache
      and tempera finish, white background, side view
    kind: prop
    category: prop
    pipeline: [3d, paint, lod, collision]
    omni:
