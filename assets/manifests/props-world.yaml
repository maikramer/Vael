# Grupo worldprops — props que substituem os objetos ainda feitos de primitivas
# (bandeiras, carroças, carrinho de mina, cais, paliçada, varal, leiras, derrick,
# portão do mercado e abrigo do posto). Consumidos por URL/prefab no mundo.
# Regenerar: cd assets && gameassets resume --profile game.yaml --manifest manifests/props-world
output_dir: ../public/assets
meshes_subdir: meshes/props
images_subdir: images/props
assets:
  - id: banner_stand
    idea:
      cartoon fantasy tall wooden banner stand, single thick round wooden pole
      planted in a low grey stone plinth, short horizontal cross arm at the top,
      long rectangular cloth banner hanging from the arm, deep red cloth with
      gold trim and a simple heraldic emblem, weathered timber, painterly
      storybook style, white background, straight front view
    kind: environment
    category: prop
    pipeline: [3d, paint, lod, collision]
    omni:
      control_type: bbox
      size_m: [1.6, 4.8, 1.2]
