# Grupo swamp — vegetação e estruturas do Pântano da Bruma / Lodo (Ofício Talhado & Iluminura Rural).
# Defs base (estilo, ferramentas, presets) em ../game.yaml e ../docs/ART.md.
# Regenerar: gameassets resume --profile game.yaml --manifest manifests/swamp
output_dir: ../public/assets
meshes_subdir: meshes/swamp
images_subdir: images/swamp
assets:
  - id: dead_willow
    idea:
      ancient dead bog willow tree with wide drooping leafless branches spanning left-right,
      twisted dark peat-grey trunk with carved chamfered bark planes, moss-covered roots
      emerging from dark mire, matte gouache and tempera finish in broad clean color blocks,
      broad canopy silhouette
    kind: environment
    category: vegetation
    pipeline:
      - 3d
      - paint
      - lod
      - collision
    lod_levels: 2
    omni:
      control_type: bbox
      size_m:
        - 3.9
        - 6.0
        - 3.0
    # A copa fina (ramos pendentes) a 416 colapsava em blocos; 512 resolve
    # melhor o detalhe. O debris a 1% (clean) remove as tiras soltas.
    text3d:
      octree_resolution: 512
    # Árvore de ramos finos: o unwrap xatlas passa dos 300 s no default de
    # 269k faces do atlas (bounded; a linha falha). A 20k o paint fecha em
    # ~34k faces e a textura cobre o resto do detalhe. O LOD0 continua nos
    # 12k da categoria — o cap do paint não mexe no orçamento do LOD.
    paint3d:
      to_paint_faces: 20000
    # Sem Hi3D neste asset: o refine re-sintetiza os ramos finos como centenas
    # de ilhas e o atlas do paint fragmenta-se — o LOD0 não descia ao orçamento
    # de 12k da categoria (saía a 33-45k, v/tri > 1,8). Do clean o ladder
    # fecha no alvo (12k, v/tri 1,4).
    refine: false
  - id: lily_pad
    idea:
      broad bog water-lily pad with carved chamfered leaf rim in deep olive-reed green and
      a pale cream-ochre lotus bud on top, matte gouache and tempera finish, Pântano da Bruma
      floating vegetation prop
    kind: prop
    category: vegetation
    pipeline:
      - 3d
      - paint
      - lod
      - collision
    omni:
      control_type: bbox
      bbox_preset: flat
      size_m:
        - 1.2
        - 0.15
        - 1.2
  - id: moss_rock
    # seed 40411: regenerado na review visual de 2026-10-22 (a geração anterior
    # saiu com textura manchada/embaralhada).
    seed: 40411
    idea:
      dark slate-grey angular bog boulder with crisp chamfered rocky facets, thick patches
      of olive-green peat moss on the top and upper ledges, pale lime water-level flood marks
      near the base, matte gouache and tempera finish in broad clean color blocks
    kind: prop
    category: terrain
    pipeline:
      - 3d
      - paint
      - lod
      - collision
    omni:
      control_type: bbox
      bbox_preset: cube
      size_m:
        - 1.5
        - 1.0
        - 1.2
  - id: swamp_shack
    # seed 40412: regenerado na review visual de 2026-10-22 (a geração anterior
    # saiu com textura manchada/embaralhada).
    seed: 40412
    idea:
      weathered fisher wooden shack on sturdy hand-hewn timber stilts with crisp chamfered
      architectural planes, tarred plank walls with white lime flood-level gauge marks along
      the door jamb and lower pilings, sagging reed-thatch roof, small warm amber brass
      lantern by the doorway, matte gouache and tempera finish in broad clean color zones
    kind: environment
    category: building
    pipeline:
      - 3d
      - paint
      - lod
      - collision
    omni:
      control_type: bbox
      bbox_preset: building
      size_m:
        - 5.0
        - 4.0
        - 5.0
  - id: wrecked_boat
    idea:
      broken wooden rowboat hull half-sunk in mire with hand-hewn chamfered tarred oak planks,
      cracked gunwale, missing stern and coiled hemp rope, sitting flush to ground, exterior
      only, matte gouache and tempera finish in dark tarred timber and mud-ochre, no characters
    kind: prop
    category: prop
    pipeline:
      - 3d
      - paint
      - lod
      - collision
    omni:
      control_type: bbox
      size_m:
        - 3.5
        - 1.2
        - 1.4
  - id: bone_altar
    idea:
      ancient bog memorial cairn altar built of a flat chamfered slate slab resting on bog-oak
      posts, arranged with weathered pale animal skulls, river stones and a faint turquoise
      crystal notch, low wide silhouette, matte gouache and tempera finish, stylized not gory
    kind: prop
    category: prop
    pipeline:
      - 3d
      - paint
      - lod
      - collision
    omni:
      control_type: bbox
      bbox_preset: crate
      size_m:
        - 1.6
        - 1.0
        - 1.2
