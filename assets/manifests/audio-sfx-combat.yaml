# Pack audio-sfx-combat — impactos/armas/colheita (Stable Audio 3 Small SFX).
# Direção: transiente na frente, cauda curta; combate repetido não pode empilhar
# anéis longos. Canónico em assets/; exemplos consomem o pool por URL.
# Regenerar: cd assets && python3 regen_audio.py --only sfx/combat --force
output_dir: ../public/assets
meshes_subdir: meshes/audio
images_subdir: images/audio
assets:
  - id: sfx/combat/hit
    idea: Sharp metal sword clash on steel, bright ringing impact, short combat hit, tight decay
    kind: prop
    category: weapon
    pipeline:
      - audio
    audio:
      duration: 0.6
      profile: effects
    seed: 201
  - id: sfx/combat/swing
    idea: Quick sword swing through air, fast blade swish with a short low whoosh, no tone
    kind: prop
    category: weapon
    pipeline:
      - audio
    audio:
      duration: 0.5
      profile: effects
    seed: 401
  - id: sfx/combat/chop_hit
