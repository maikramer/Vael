# Small handheld pickup (Ofício Talhado & Iluminura Rural).
# The engine supplies the glow and the collection animation.
output_dir: ../public/assets
meshes_subdir: meshes/props
images_subdir: images/props
assets:
  - id: life_vial
    kind: prop
    gpu: remote
    refine: false
    seed: 61844
    idea: >
      A single small upright apothecary healing flask, faceted thick glass belly filled with
      deep madder-crimson herbal draught, bound with a simple cross-strap of stitched brown
      leather, short narrow neck with aged brass collar and chamfered beeswax-sealed cork
      stopper. Matte gouache and tempera finish in broad clean color blocks, strong bold
      silhouette, front view, isolated centered on white, no label or lettering.
    pipeline: [3d, paint, lod]
    omni:
      control_type: bbox
      size_m: [0.18, 0.26, 0.18]
    paint3d:
      texture_size: 512
