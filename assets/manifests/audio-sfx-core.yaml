# Pack audio-sfx-core — os 4 clips base da engine Viber (hit/whoosh/harvest/ui).
# A engine (`Viber/src/ambient.rs::SfxClip`) aponta para estes .ogg.
# Direção: impacto curto e denso, sem cauda; UI seca; colheita com pop curto.
# Regenerar: cd assets && python3 regen_audio.py --only sfx/hit,sfx/whoosh,sfx/harvest,sfx/ui --force
output_dir: ../public/assets
meshes_subdir: meshes/audio
images_subdir: images/audio
assets:
  - id: sfx/hit
    idea: Heavy sword blade hitting a wooden shield, short dense impact with a bright metallic snap, close combat hit, no reverb tail
    kind: prop
    category: weapon
    pipeline:
      - audio
    audio:
      duration: 0.6
      profile: effects
    seed: 210
  - id: sfx/whoosh
    idea: Fast blade whoosh cutting through air, short sharp swish with a tight low end, no tone, no reverb
    kind: prop
    category: weapon
    pipeline:
      - audio
    audio:
      duration: 0.5
      profile: effects
    seed: 410
  - id: sfx/harvest
    idea: Soft herb harvest pluck, crisp stem snap with a small rewarding pop, close and dry, gathering plants
    kind: prop
    category: collectible
    pipeline:
      - audio
    audio:
      duration: 0.6
      profile: effects
    seed: 420
  - id: sfx/ui
    idea: Clean short UI click, soft wooden tick with a tiny bright tap, menu select, no reverb
    kind: prop
    category: ui
    pipeline:
      - audio
    audio:
      duration: 0.5
      profile: effects
    seed: 430
