    idea:
      'very tall narrow medieval stone watchtower nine meters high, square 3 by
      3 meter base, slender vertical shaft much taller than wide, squared heavy dressed stone
      base with weathered lime-mortar wash flush to ground with sharp chamfered block edges and
      no flared footings, crisp crenellated battlements on top, thin straight hand-hewn wooden
      ladder with clear separate rungs, continuous thin flagpole with attached solid ochre banner
      flag (no gaps), observation platform, clean hard architectural silhouettes, matte gouache
      and tempera finish in broad clean color zones, game-ready prop, not a short cube keep

      '
