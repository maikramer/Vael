  - id: market_stall
    # Toldo LISO (era listrado): o refine não cabe no decode do VAE em 6 GiB
    # (~5 GiB de ativação; nem group offload, 30k de estrutura ou 50k de input
    # o reduzem) e o paint clean parte o padrão listrado nas ilhas UV — o
    # toldo virava mosaico azul/ouro. Cor única elimina o contraste que
    # denuncia as costuras; o resto do booth fica igual. `refine: false`
    # evita a tentativa de Hi3D que só gasta ~10 min para falhar no decode.
    refine: false
    idea:
      rural medieval market stall with solid single-color slate-blue canvas awning, hand-hewn
      chamfered oak timber counter and posts, coarse burlap grain sacks and woven baskets,
      matte gouache and tempera finish in broad clean color blocks without stripes or
      micro-patterns
    kind: environment
    category: building
    pipeline:
      - 3d
      - paint
      - lod
      - collision
    omni:
      control_type: bbox
      bbox_preset: building
      size_m:
        - 3.0
        - 2.5
        - 2.0
