# Grupo village — edifícios e props de Discórdia (Ofício Talhado & Iluminura Rural).
# Defs base em ../game.yaml e ../docs/ART.md.
# Regenerar: cd assets && gameassets resume --profile game.yaml --manifest manifests/village
output_dir: ../public/assets
meshes_subdir: meshes/village
images_subdir: images/village
assets:
  - id: village_longhouse
    seed: 90210
    idea:
      rural medieval communal longhouse hall with crisp chamfered architectural planes,
      squared dressed stone foundation with weathered lime-mortar wash sitting flush to the
      ground, thick hand-hewn oak timber beams with flat carved facets, steep roof of broad
      dark slate shingles with clean geometric edges, recessed heavy plank double doors with
      forged black wrought-iron hinges and a subtle carved turquoise crystal choir emblem on
      the wooden lintel, warm amber candlelight glow behind thick mullioned windows, matte
      gouache and tempera painted finish in broad clean color zones of warm lime-grey, smoked
      oak, slate and ochre, eye-level three-quarter view from front-right, solid closed base
    kind: environment
    category: building
    pipeline:
      - 3d
      - paint
      - lod
      - collision
    omni:
      control_type: bbox
      bbox_preset: building
      size_m:
        - 5.5
        - 5.5
        - 10.0
