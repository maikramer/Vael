# Pack audio-sfx-creatures — vocalizações/ferimentos/mortes de criaturas
# (Stable Audio 3 Small SFX). Vocalizações animais, sem palavras nem música.
# Regenerar: cd assets && python3 regen_audio.py --only sfx/creatures --force
output_dir: ../public/assets
meshes_subdir: meshes/audio
images_subdir: images/audio
assets:
  - id: sfx/creatures/enemy_hurt
    idea: Creature taking a hit, short wet pained yelp, wounded beast gasp, close
    kind: character
    category: creature
    pipeline:
      - audio
    audio:
      duration: 0.6
      profile: effects
    seed: 502
  - id: sfx/creatures/enemy_death
    idea: Creature death cry, rasping fading wail, body collapsing, close and dry
    kind: character
    category: creature
    pipeline:
      - audio
    audio:
      duration: 1.4
      profile: effects
    seed: 503
  - id: sfx/creatures/boss_roar
    idea: Massive boss monster roar, deep bellowing beast cry with chest rumble, terrifying entrance, close
    kind: character
    category: creature
    pipeline:
