    idea: Creature taking a hit, short wet pained yelp, wounded beast gasp, close
    kind: character
    category: creature
    pipeline:
      - audio
    audio:
      duration: 0.6
      profile: effects
    seed: 502
  - id: sfx/creatures/enemy_death
