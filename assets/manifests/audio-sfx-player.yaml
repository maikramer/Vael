# Pack audio-sfx-player — movimentos do herói (Stable Audio 3 Small SFX).
# `movement` → sfx_movement (antes a categoria `sfx_movement` era ignorada e o
# clip saía sem hints). Passos são UM passo, não uma sequência: a engine toca
# o clip a cada passo e sequências de 3 s sobrepunham-se.
# Regenerar: cd assets && python3 regen_audio.py --only sfx/player,sfx/ambient/footstep --force
output_dir: ../public/assets
meshes_subdir: meshes/audio
images_subdir: images/audio
assets:
  - id: sfx/player/jump
    idea: Light armored character jump, soft push-off with cloth rustle, short leap, close
    kind: prop
    category: movement
    pipeline:
      - audio
    audio:
      duration: 0.5
      profile: effects
    seed: 440
  - id: sfx/player/dash
    idea: Fast dash burst, airy swoosh of sudden movement with a cloth flap, short, close
    kind: prop
    category: movement
    pipeline:
      - audio
    audio:
      duration: 0.5
      profile: effects
    seed: 441
  - id: sfx/ambient/footstep
    idea: Single boot step on dry grass and dirt, soft crunch, close, one step only
    kind: prop
    category: movement
    pipeline:
      - audio
    audio:
      duration: 0.5
      profile: effects
    seed: 442
  - id: sfx/ambient/footstep_water
    idea: Single boot splashing in shallow water, short wet splash, close, one step only
    kind: prop
    category: movement
    pipeline:
      - audio
    audio:
      duration: 0.5
      profile: effects
    seed: 443
