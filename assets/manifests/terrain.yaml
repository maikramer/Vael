# Grupo terrain — formações rochosas, mojões e marcos do Vale (Ofício Talhado & Iluminura Rural).
# Defs base em ../game.yaml e ../docs/ART.md.
# Regenerar: cd assets && gameassets resume --profile game.yaml --manifest manifests/terrain
output_dir: ../public/assets
meshes_subdir: meshes/terrain
images_subdir: images/terrain
assets:
  - id: form_cliff_1
    idea:
      jagged alpine granite mountain cliff with crisp chamfered rock facets, blue-grey stone
      with snow accumulation on the upper ledges, steep rocky face, deeper front-to-back rock
      mass, solid closed base, matte gouache and tempera finish in broad clean color blocks
    kind: environment
    category: terrain
    text3d:
      voxel_merge: 0.375
    pipeline:
      - 3d
      - paint
      - collision
    omni:
      control_type: bbox
      size_m:
        - 2.1
        - 3.0
        - 2.15
