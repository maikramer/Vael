# Fauna ambiente de Vael (Ofício Talhado & Iluminura Rural).
# Regenerar na raiz do jogo com tools/regen_remote.sh fauna.
output_dir: ../public/assets
meshes_subdir: meshes/fauna
images_subdir: images/fauna
assets:
  - id: fox
    idea: >-
      red valley fox with carved chamfered fur planes in burnt sienna-ochre, unbleached cream
      muzzle and tail tip, charcoal-black lower legs, four distinct legs in a relaxed standing
      pose and a thick tail extended behind, side three-quarter view. Single full animal,
      matte gouache and tempera finish in broad clean color blocks, isolated on plain white,
      no scenery or base.
    seed: 81210
    kind: character
    category: creature
    gpu: remote
    pipeline: [3d, paint, rig, animate, lod]
    lod_levels: 1
    omni:
      control_type: bbox
      size_m: [1.32, 0.7, 0.32]
      bbox: [1.0, 0.53, 0.242]
    animate:
      preset: quadruped
      facing: "-x"
      procedural: true
      force_preset: true
      clips: idle,walk,run
  - id: rat
    idea: >-
      A single brown field rat scurrying on all fours in strict side profile. Long horizontal
      back with sculpted chamfered planes, low narrow head with pointed snout aimed to the
      right, small upright ears, raw umber and slate-brown coat, four separate grounded feet,
      long slender tail stretched out behind to the left. Anatomically proportioned rodent,
      matte gouache and tempera field-guide finish against white, full silhouette including tail.
    seed: 81241
    kind: character
    category: creature
    gpu: remote
    pipeline: [3d, paint, rig, animate, lod]
    lod_levels: 1
    omni:
