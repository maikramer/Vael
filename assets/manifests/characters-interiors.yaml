# NPCs de INTERIOR — o povo que vive dentro das casas (Ofício Talhado & Iluminura Rural).
# Manifest PRÓPRIO de propósito: `resume` só corre as fases pendentes, e um
# ficheiro separado garante que nenhum asset já pronto do pack `characters` é
# tocado por este lote.
#
# Regenerar:
#   cd assets
#   gameassets resume --profile game.yaml --manifest manifests/characters-interiors
output_dir: ../public/assets
meshes_subdir: meshes/characters
images_subdir: images/characters
assets:
  - id: npc_innkeeper
    # seed 40415: regenerado na review visual de 2026-10-22 (a geração anterior
    # saiu com textura manchada/embaralhada).
    seed: 40415
    idea:
      sturdy rural innkeeper NPC with 6.5-head craft proportions and sculpted chamfered
      facial planes, wearing a hearth-stained heavy linen apron over a rolled-sleeve
      ochre shirt and dark wool trousers, wiping cloth tucked at belt, warm welcoming
      expression, slightly emphasized working hands and forearms, matte gouache and
      tempera finish with broad clean color blocks and earthy mineral pigments, standing
      upright in relaxed A-pose with arms angled down at 45 degrees away from the body,
      legs straight and shoulder-width apart with clear gap from thighs to feet, visible
      gap between arms and torso, relaxed open hands with fingers held together and palms facing the thighs, hands empty, no weapons, no props, full body visible, front-facing
    kind: character
    category: humanoid
    pipeline:
      - 3d
      - paint
      - rig
      - animate
      - lod
      - collision
    lod_levels: 1
    animate:
      preset: humanoid
      force_preset: true
      clips: idle,walk,talk,call,foldarms,eat,yes,no
    omni:
      control_type: pose
      pose_preset: quaternius-apose
      size_m:
        - 0.7
        - 1.6
        - 0.55
