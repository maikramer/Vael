# Pack audio-sfx-ui — moedas/menus/notificações (Stable Audio 3 Small SFX).
# Canónico em assets/.
# Regenerar: cd assets && python3 regen_audio.py --only sfx/ui/coin,sfx/ui/buy,sfx/ui/error,sfx/ui/save,sfx/ui/load,sfx/ui/levelup,sfx/ui/shop_open,sfx/ui/quest_accept,sfx/ui/quest_complete,sfx/ui/notification,sfx/ui/pause,sfx/ui/game_over --force
output_dir: ../public/assets
meshes_subdir: meshes/audio
images_subdir: images/audio
assets:
  - id: sfx/ui/coin
    idea: Bright coin pickup, small metallic chime with a short sparkle, close, no reverb
    kind: prop
    category: collectible
    pipeline:
      - audio
    audio:
      duration: 0.5
      profile: effects
    seed: 509
  - id: sfx/ui/buy
    idea: Merchant purchase confirmation, warm chime with a coin clink, short and satisfying
    kind: prop
    category: ui
    pipeline:
      - audio
    audio:
      duration: 0.7
      profile: effects
    seed: 507
  - id: sfx/ui/error
