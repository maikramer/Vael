# Pack audio-sfx-ui — moedas/menus/notificações/eventos de corrida
# (Stable Audio 3 Small SFX). Canónico em assets/.
# `collectible` → sfx_collectible; `ui` → sfx_ui. Os sons de corrida
# (countdown/go/lap/finish) são legado do exemplo racer e ficam como estão.
# Regenerar: cd assets && python3 regen_audio.py --only sfx/ui/coin,sfx/ui/buy,sfx/ui/error,sfx/ui/save,sfx/ui/load,sfx/ui/levelup,sfx/ui/shop_open,sfx/ui/quest_accept,sfx/ui/quest_complete,sfx/ui/notification,sfx/ui/pause,sfx/ui/game_over --force
output_dir: ../public/assets
meshes_subdir: meshes/audio
images_subdir: images/audio
assets:
  - id: sfx/ui/coin
    idea: Bright coin pickup, small metallic chime with a short sparkle, close, no reverb
    kind: prop
    category: collectible
    pipeline:
      - audio
    audio:
      duration: 0.5
      profile: effects
    seed: 509
  - id: sfx/ui/buy
    idea: Merchant purchase confirmation, warm chime with a coin clink, short and satisfying
    kind: prop
    category: ui
    pipeline:
      - audio
    audio:
      duration: 0.7
      profile: effects
    seed: 507
  - id: sfx/ui/error
    idea: Short negative UI buzz, descending rejection blip, dry and digital, no reverb
    kind: prop
    category: ui
    pipeline:
      - audio
    audio:
      duration: 0.5
      profile: effects
    seed: 508
  - id: sfx/ui/save
    idea: Soft save confirmation, two-note digital chime, short and clean
    kind: prop
    category: ui
    pipeline:
      - audio
    audio:
      duration: 0.5
      profile: effects
    seed: 512
  - id: sfx/ui/load
    idea: Short magical loading shimmer, rising sparkle with a soft airy tail, no melody
    kind: prop
    category: ui
    pipeline:
      - audio
    audio:
      duration: 0.6
      profile: effects
    seed: 513
  - id: sfx/ui/levelup
    idea: Triumphant level-up fanfare, rising wordless choir and harp flourish, bright and rewarding
    kind: prop
    category: collectible
    pipeline:
      - audio
    audio:
      duration: 1.6
      profile: effects
    seed: 400
  - id: sfx/ui/shop_open
    idea: Friendly shop bell and wooden door, warm welcome chime, close
    kind: prop
    category: ui
    pipeline:
      - audio
    audio:
      duration: 0.9
      profile: effects
    seed: 506
  - id: sfx/ui/quest_accept
    idea: Bright quest accepted jingle, short paper page turn and a clean chime, adventurous
    kind: prop
    category: collectible
    pipeline:
      - audio
    audio:
      duration: 1
      profile: effects
    seed: 520
  - id: sfx/ui/quest_complete
    idea: Quest complete fanfare, harp flourish with a warm wordless choir swell, triumphant but short
    kind: prop
    category: collectible
    pipeline:
      - audio
    audio:
      duration: 1.8
      profile: effects
    seed: 516
  - id: sfx/ui/notification
    idea: Soft two-note notification ping, gentle interface chime, brief and clean
    kind: prop
    category: ui
    pipeline:
      - audio
    audio:
      duration: 0.5
      profile: effects
    seed: 517
  - id: sfx/ui/pause
    idea: Soft pause menu blip, muted transition with a small low thud, brief
    kind: prop
    category: ui
    pipeline:
      - audio
    audio:
      duration: 0.5
      profile: effects
    seed: 518
  - id: sfx/ui/game_over
    idea: Defeat sting, descending low wordless choir and cello, slow final cadence, no drums
    kind: prop
    category: ui
    pipeline:
      - audio
    audio:
      duration: 2.4
      profile: effects
    seed: 519
  # ── Legado do exemplo racer — não faz parte da direção do Vale. ──
  - id: sfx/ui/countdown
    legacy: true
    idea: Single short countdown beep, clean digital tone, race start ready signal, brief electronic beep
    kind: prop
    category: ui
    pipeline:
      - audio
    audio:
      duration: 0.6
      profile: effects
    seed: 305
  - id: sfx/ui/go
    legacy: true
    idea: Loud race start horn blast, GO signal klaxon, powerful air horn, short urgent starting signal
    kind: prop
    category: ui
    pipeline:
      - audio
    audio:
      duration: 1
      profile: effects
    seed: 306
  - id: sfx/ui/lap
    legacy: true
    idea: Soft lap completion chime, pleasant two-tone bell, checkpoint confirm sound, gentle success ping
    kind: prop
    category: ui
    pipeline:
      - audio
    audio:
      duration: 1
      profile: effects
    seed: 308
  - id: sfx/ui/finish
    legacy: true
    idea: Triumphant race finish fanfare, short victory jingle, celebratory brass melody, crossing the finish line
    kind: prop
    category: item
    pipeline:
      - audio
    audio:
      duration: 4
      profile: effects
    seed: 309
