    idea: Warm fantasy title theme, wordless mixed choir humming a four-note motif (rising fourth, second degree, falling minor third) over harp and crystal glass harmonica, gentle strings, hopeful and inviting, dawn over a mountain valley, 80 BPM
    kind: environment
    category: humanoid
    pipeline:
      - audio
    audio:
      duration: 48
      profile: music
    seed: 320
