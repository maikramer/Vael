# Pack audio-bgm — músicas em loop (BGM) partilhadas entre jogos.
# Identidade do Vale: "Coro de Vael" — coro sem palavras + harmónica de vidro +
# cordas, sobre um motivo de quatro notas (quarta ascendente, segundo grau,
# terça menor descendente). Ver docs/AUDIO.md.
#
# Stable Audio 3 Small Music; kind music_loop via category humanoid → pipeline
# seamless exacto (crossfade equal-power, edge trim adaptativo, loop final =
# duration pedido, alinhado a compassos ao BPM do prompt).
# Canónico em assets/ (manifests + binários em public/assets).
# Regenerar: cd assets && python3 regen_audio.py --only bgm --force
# (gate de costura: re-rola a seed +1000 até cauda ≥70% do corpo.)
output_dir: ../public/assets
meshes_subdir: meshes/audio
images_subdir: images/audio
assets:
