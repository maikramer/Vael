# Grupo desert — vegetação e ruínas do Ermo Rubro (Ofício Talhado & Iluminura Rural).
# Defs base (estilo, ferramentas, presets) em ../game.yaml e ../docs/ART.md.
# Regenerar: gameassets resume --profile game.yaml --manifest manifests/desert
output_dir: ../public/assets
meshes_subdir: meshes/desert
images_subdir: images/desert
assets:
  - id: cactus
    idea:
      red-wastes columnar saguaro cactus with wide left-right silhouette, three thick arms
      spreading sideways, carved chamfered vertical ribs in dusty olive-sage green, matte
      gouache and tempera finish with broad clean color blocks, vertical trunk
    kind: environment
    category: vegetation
    pipeline:
      - 3d
      - paint
      - lod
      - collision
    lod_levels: 2
    omni:
      control_type: bbox
      size_m:
        - 1.8
        - 3.5
        - 0.71
  - id: dead_bush
    idea:
      sun-bleached dry desert scrub bush with angular chamfered wooden branches in bone-ochre
      and burnt umber, sparse dry leaves, matte gouache and tempera finish, Ermo Rubro arid
      plant prop
    kind: prop
    category: vegetation
    pipeline:
      - 3d
      - paint
      - lod
      - collision
    omni:
      control_type: bbox
      bbox_preset: blob
      size_m:
        - 1.5
        - 1.0
        - 1.5
  - id: ruin_pillar
    idea:
      ancient Ermo Rubro ferruginous sandstone ruin pillar with crisp chamfered stone drums,
      weathered geometric cartographic survey notches carved in the shaft, fractured capital,
      solid base flush to ground, matte gouache and tempera finish in terracotta, dry ochre
      and slate-grey
    kind: environment
    category: building
    pipeline:
      - 3d
      - paint
      - lod
      - collision
    omni:
      control_type: bbox
      bbox_preset: building
      size_m:
        - 1.2
        - 4.0
        - 1.2
  - id: scorpion_nest
    text3d:
      octree_resolution: 256
    idea:
      low wide red-wastes sandstone and packed ochre-clay burrow mound with a dark tunnel
      entrance hole, angular stratified earth ledges hugging the ground, sun-bleached rib
      bones by the entrance, flat wide solid base, matte gouache and tempera finish
    kind: environment
    category: terrain
    pipeline:
      - 3d
      - paint
      - lod
      - collision
    omni:
      control_type: bbox
      bbox:
        - 1.0
        - 0.48
        - 1.0
      size_m:
        - 2.5
        - 1.2
        - 2.5
  - id: desert_obelisk
    idea:
      tall slender Ermo Rubro red-sandstone survey obelisk with crisp chamfered edges and a
      recessed turquoise-blue Choir crystal vein notch near the pyramidal peak, ferruginous
      terracotta and dry ochre stone, square tapered shaft on stepped base flush to ground,
      matte gouache and tempera finish, upright landmark
    kind: environment
    category: building
    pipeline:
      - 3d
      - paint
      - lod
      - collision
    omni:
      control_type: bbox
      height_m: 8.0
      footprint_m: 1.4
  - id: sandstone_arch
    idea:
      monumental Ermo Rubro stratified red-sandstone arch ten meters tall, thick chamfered
      rock pillars and flat-faceted keystone arch, ferruginous terracotta and ochre stone with
      slate-blue shadow crevices, canyon landmark freestanding flush to ground, front view,
      matte gouache and tempera finish, clean architectural silhouette, no characters
    kind: environment
    category: building
    pipeline:
      - 3d
      - paint
      - lod
      - collision
    omni:
      control_type: bbox
      size_m:
        - 8.0
        - 10.0
        - 2.5
