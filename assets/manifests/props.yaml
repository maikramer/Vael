# Grupo props — rochas e elementos de terreno base (Ofício Talhado & Iluminura Rural).
# Props de identidade de ofício/combate ficam em props-rpg.yaml e props-world.yaml.
# Regenerar: cd assets && gameassets resume --profile game.yaml --manifest manifests/props
output_dir: ../public/assets
meshes_subdir: meshes/props
images_subdir: images/props
assets:
  - id: rock_mossy
    idea:
      weathered valley boulder with crisp angular chamfered rock facets, bare slate-grey stone
      sides, deep olive-green moss patches and small shelf fungi resting on the upper ledges,
      matte gouache and tempera finish in broad clean color blocks
    kind: prop
    category: terrain
    pipeline:
      - 3d
      - paint
      - lod
      - collision
    omni:
      control_type: bbox
      bbox_preset: cube
      size_m:
        - 1.4
        - 1.0
        - 1.2
