# Pack audio-sfx-world — interações com o mundo (portas/baús/fogo/passos) e
# física de itens (Stable Audio 3 Small SFX). Canónico em assets/.
# `vocal` → sfx_vocal (grunhido do herói); `prop` → sfx_interact.
# Regenerar: cd assets && python3 regen_audio.py --only sfx/world --force
output_dir: ../public/assets
meshes_subdir: meshes/audio
images_subdir: images/audio
assets:
  - id: sfx/player/hurt
    idea: Painful male warrior grunt taking damage, sharp exhale of pain, short hurt vocalization, close, no words
    kind: character
    category: vocal
    pipeline:
      - audio
    audio:
      duration: 0.6
      profile: effects
    seed: 501
  - id: sfx/player/heal
    idea: Warm healing spell, soft rising crystal chime and a gentle wordless choir swell, soothing restoration
    kind: character
    category: effects
    pipeline:
      - audio
    audio:
      duration: 1.4
      profile: effects
    seed: 505
  - id: sfx/world/item_drop
