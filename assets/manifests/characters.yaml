# Grupo characters — herói, NPCs, criaturas e bosses (Ofício Talhado & Iluminura Rural).
# Defs base (estilo, ferramentas, presets) em ../game.yaml e ../docs/ART.md.
# Regenerar: gameassets resume --profile game.yaml --manifest manifests/characters
output_dir: ../public/assets
meshes_subdir: meshes/characters
images_subdir: images/characters
assets:
  - id: hero
    # Seed novo (2026-10-29): o anterior (69607440) saía com a cara/mãos que o
    # utilizador não gostou. Aplica-se a text2d + text3d.
    seed: 42424242
    # Sem override de steps: o preset hq do game.yaml dá 50 passos (o antigo
    # override de 40 era um downgrade) e o piso humanoid fixa o octree em 384.
    text3d:
      mc_level: 0
      back_details: a single cylindrical weathered brown leather map tube with brass end-caps strapped diagonally across the closed back of the brown leather vest below the short moss-green collar capelet (only ONE map tube, completely external outside the vest, never duplicated, never sunk into the body)
    idea:
      stylized rural fantasy cartographer with 6.5-head craft proportions and sculpted
      chamfered facial planes, wearing coarse unbleached linen shirt with rolled-up sleeves,
      weathered brown leather work vest and short moss-green shoulder collar capelet that
      stays above the shoulders leaving arms and legs completely unobstructed, external cylindrical
      leather map case strapped diagonally completely outside high on the back, simple leather tool belt with small pouch,
      sturdy mud-stained leather marching boots, slightly emphasized working hands and
      forearms, matte gouache and tempera finish with broad clean color blocks and earthy
      mineral pigments, no helmet, no armor, no hip lantern in mesh, standing upright in
      relaxed A-pose with both arms straight and angled down at 45 degrees away from the
      body, legs straight and slightly apart, feet shoulder-width apart, clear gap between
      the legs from thighs to feet, visible gap between arms and torso, relaxed open hands with fingers held together and palms facing the thighs, hands empty, no weapons, no
      props, full body visible, front-facing
    kind: character
    category: humanoid
    omni:
      control_type: pose
      pose_preset: quaternius-apose
      size_m:
        - 0.55
        - 1.55
        - 0.4
    pipeline:
      - 3d
      - paint
      - rig
      - animate
      - lod
      - collision
    lod_levels: 1
    animate:
      preset: humanoid
      force_preset: true
      # all = villager + UAL1 + UAL2: mine/gather vêm do villager (KevDev) e a
      # UAL substitui locomoção/combate; ver Animator3D data/retarget/*.yaml.
      anim_pack: all
      clips: idle,walk,run,sprint,jump,fall,jumpland,roll,attack,hit,hithead,death,punch,sword,sworda,swordb,swordc,swordheavy,axe,spear,chop,swordidle,axeidle,spearidle,chopidle,mine,gather,interact,harvest,fixing,roar,dance,talk,yes,no,crouchidle,chestopen
