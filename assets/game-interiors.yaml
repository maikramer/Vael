# PERFIL DO LOTE DE INTERIORES — cópia de game.yaml com `generation: low`.
#
# PORQUÊ: o perfil `medium` pede a imagem 2D a 1024², e o pico de ativação
# (~5,3 GB) não cabe numa GPU de 6 GB ao lado de mais nada — o vramd recusa
# o job em vez de deixar a placa OOM. `low` gera a 768² (a mesma largura que
# o game.yaml declara) com o resto do pipeline (shape/paint) também mais
# barato. Os NPCs do pool saíram de `medium`; estes são um pouco mais
# grosseiros de malha, mas a mesma família de estilo/paleta.
#
# Este ficheiro é SÓ para manifests/characters-interiors. O game.yaml
# partilhado fica intacto (outros lotes/pools leem dele).
# Direção de arte: Ofício Talhado & Iluminura Rural (ver ../docs/ART.md).
title: O Silêncio de Vael
genre: rural craft fantasy, carved chamfered wood and lime-washed stone, matte gouache and tempera finish
tone: handcrafted artisanal materials, crisp chamfered planes, broad clean color blocks, functional worn craft tools, earthy mineral pigments, quiet rural valley
style_preset: painterly
output_dir: public/assets
path_layout: split
images_subdir: images
meshes_subdir: meshes
image_ext: png
seed_base: 7777
generation: low

# Packs canónicos (audio-bgm/audio-sfx-*/characters/desert/farm/forest/infra/
# interiors/props-rpg/props/swamp/terrain/village). O happy path de
# regen é `cd assets` (raiz do Vael) — o batch escreve em public/assets
# **daqui** (fonte canónica dos binários). Não há passo de sync nem symlinks.
master_validate: true
master_bake_normals: false
negative_keywords:
  - gore
  - realistic
  - photorealistic
  - dark gritty
  - scary
  - plastic glossy sheen
  - neon oversaturated colors
  - chibi bobblehead proportions
  - generic mobile cartoon
  - busy micro-patterns
  - ornate filigree noise
  - melted organic edges
text2d:
  width: 768
  height: 768
text2sound:
  quality: high
  audio_format: ogg
text3d:
  export_origin: feet
  bounds_mode: auto
  mc_level: auto
  split_at_height: true
  sdnq_preset: sdnq-int4
  memory_efficient: true
# Refine multiview opcional (ver game.yaml/README): refine: {views: 1}
# Personagens: retarget encadeado villager + UAL1+UAL2 — trabalhos kevdev
# (mining/hammer/pesca por-ficheiro) com a UAL por cima em idle/gather/combos.
animator3d:
  preset: humanoid
  anim_pack: all
# Criaturas animam a partir de *_lod2.glb — o rig tem de sobreviver a todos os
# níveis (default 1 deixaria o lod2 estático = inimigos congelados).
lod:
  rig_max_level: 2
  # Pós-lod automático UV-masked (normal OpenGL + ORM R=AO sem costuras UV).
  patch_pbr: true
paint3d:
  preserve_origin: true
  texture_size: 2048
  pbr_enrich: true
