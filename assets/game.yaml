# Direção de arte: Ofício Talhado & Iluminura Rural (ver ../docs/ART.md).
title: O Silêncio de Vael
genre: rural craft fantasy, carved chamfered wood and lime-washed stone, matte gouache and tempera finish
tone: handcrafted artisanal materials, crisp chamfered planes, broad clean color blocks, functional worn craft tools, earthy mineral pigments, quiet rural valley
style_preset: painterly
output_dir: public/assets
path_layout: split
images_subdir: images
meshes_subdir: meshes
image_ext: png
seed_base: 7777
generation: medium

# Packs canónicos (audio-bgm/audio-sfx-*/characters/desert/farm/forest/infra/
# interiors/props-rpg/props/swamp/terrain/village). O happy path de regen é
# `cd assets` (esta pasta) — o batch escreve em public/assets **daqui**
# (fonte canónica dos binários). Não há passo de sync nem symlinks.
master_validate: true
master_bake_normals: false
negative_keywords:
  - gore
  - realistic
  - photorealistic
  - dark gritty
  - scary
  - plastic glossy sheen
  - neon oversaturated colors
  - chibi bobblehead proportions
  - generic mobile cartoon
  - busy micro-patterns
  - ornate filigree noise
  - melted organic edges
text2d:
  width: 1024
  height: 1024
text2sound:
  # highest = 24 steps + OGG 0.85 + mastering -14 LUFS. O regen_audio.py baixa
  # os one-shots para -16 LUFS/-1 dBTP por conta própria.
  quality: highest
  audio_format: ogg
text3d:
  # hq = 50 steps + octree base 384 (o bbox_tune por size_m continua a mandar
  # no octree final). Sem preset, o optimizer do batch cortava os steps para
  # 30 por target — shapes com metade do sampling dos originais.
  preset: hq
  export_origin: feet
  bounds_mode: auto
  mc_level: auto
  split_at_height: true
  sdnq_preset: sdnq-int4
  memory_efficient: true
  # Humanoides usam turnaround automático FLUX.3 Klein (front→back+left+right)
  # com alinhamento anti-6-dedos + Hunyuan3D-2mv FP16 (~2.8 GiB VRAM) e alimentam
  # o Paint3D v3 Multi-Ref com 3 vistas coerentes.
  auto_turnaround_categories:
    - humanoid
  turnaround_include_right: true
# Hi3D refine desligado (2026-11-21): em GPU de 6 GB o VAE do Hi3D estoura VRAM
# (~5 GiB de ativação) e gera arestas não-manifold; substituído por Hunyuan3D-2mv
# FP16 em personagens + mesh_denoise bilateral e Paint3D v3 FP16 em edifícios/props.
refine:
  enabled: false
  resolution: auto
  steps: 25
  max_faces_scale: 4.0
  views: 1
# Personagens: retarget encadeado villager + UAL1+UAL2 — trabalhos kevdev
# (mining/hammer/pesca por-ficheiro) com a UAL por cima em idle/gather/combos.
animator3d:
  preset: humanoid
  anim_pack: all
# Criaturas animam a partir de *_lod2.glb — o rig tem de sobreviver a todos os
# níveis (default 1 deixaria o lod2 estático = inimigos congelados).
lod:
  rig_max_level: 2
  # Pós-lod automático: text3d patch-pbr (UV-masked + OpenGL +Y + ORM R=AO)
  # garante normal + occlusion sem costuras nas bordas das ilhas UV.
  patch_pbr: true
paint3d:
  preserve_origin: true
  texture_size: 2048
  # Multi-ref automático: usa <id>_back.png e <id>_right.png quando presentes.
  multi_ref: true
  # Direção de arte Ofício Talhado & Iluminura Rural (guache/têmpera mate):
  # impede o Paint 2.1 de alucinar pele plástica (roughness 0.25) ou rosto metálico.
  roughness_min: 0.72
  metallic_max: 0.15
  # Normal OpenGL + AO de fenda UV-masked via Materialize (aigamekit_shared.pbr_uv):
  # preenche gutter por Voronoi antes do Materialize e atenua costuras UV para (128,128,255).
  pbr_enrich: true
