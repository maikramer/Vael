title: Crystal Vale shared packs
genre: cartoon fantasy
tone: bright cheerful adventure, vibrant colors, playful cartoon world, Crystal Vale
style_preset: painterly
output_dir: public/assets
path_layout: split
images_subdir: images
meshes_subdir: meshes
image_ext: png
seed_base: 7777
generation: medium

# Packs canónicos (audio-bgm/audio-sfx-*/characters/desert/farm/forest/infra/
# interiors/props-rpg/props/swamp/terrain/village). Veículos da corrida
# vivem em Viber/examples/racer-assets. O happy path de regen é `cd assets`
# (esta pasta) — o batch escreve em public/assets
# **daqui** (fonte canónica dos binários); os exemplos leem o pool por URL.
# Não há passo de sync nem symlinks.
master_validate: true
master_bake_normals: false
negative_keywords:
  - gore
  - realistic
  - photorealistic
  - dark gritty
  - scary
text2d:
  width: 768
  height: 768
text2sound:
  # highest = 24 steps + OGG 0.85 + mastering -14 LUFS. O regen_audio.py baixa
  # os one-shots para -16 LUFS/-1 dBTP por conta própria.
  quality: highest
  audio_format: ogg
text3d:
  # hq = 50 steps + octree base 384 (o bbox_tune por size_m continua a mandar
  # no octree final). Sem preset, o optimizer do batch cortava os steps para
  # 30 por target — shapes com metade do sampling dos originais.
  preset: hq
  export_origin: feet
  bounds_mode: auto
  mc_level: auto
  split_at_height: true
  sdnq_preset: sdnq-int4
  memory_efficient: true
# Hi3D refine (pós-shape, antes do paint). MONO-VISTA: o FLUX.3 Klein é um
# modelo de edição e copia a imagem de referência — as vistas "back/left/right"
# saíam ~99% idênticas à frontal (diff médio 2/255, medido a 2026-11-11), por
# isso o encadeamento multiview não acrescentava informação e só custava 4-6
# passes por asset. Fica views: 1 (refine provado) até haver vistas reais
# (render do mesh ou modelo view-conditioned). Personagens/criaturas já ficavam
# de fora (o Hi3D muda a pose). Ver assets/README.md.
refine:
  enabled: true
  resolution: auto
  steps: 25
  max_faces_scale: 4.0
  views: 1
# Personagens: retarget encadeado villager + UAL1+UAL2 — trabalhos kevdev
# (mining/hammer/pesca por-ficheiro) com a UAL por cima em idle/gather/combos.
animator3d:
  preset: humanoid
  anim_pack: all
# Criaturas animam a partir de *_lod2.glb — o rig tem de sobreviver a todos os
# níveis (default 1 deixaria o lod2 estático = inimigos congelados).
lod:
  rig_max_level: 2
  # Pós-lod automático: text3d patch-pbr garante normal+AO em todos os níveis
  # (derivados do albedo via Materialize). DESLIGADO: cada bordo de ilha UV do
  # atlas vira uma aresta normal/AO falsa — as costuras visíveis nos modelos.
  patch_pbr: false
paint3d:
  preserve_origin: true
  texture_size: 2048
  # O _to_paint segue a fórmula do paint_budget (~270k faces a 2048): o xatlas
  # a 265k fica em ~160 s agora que o refine é refixado com morph-close antes
  # do simplify (ver pipeline.py). Sem esse refix, decimar o _refined
  # estilhaçava a malha e o unwrap passava dos 600 s (medido a 2026-11-11).
  # Personagens têm cap próprio de 100k em pipeline.py.
  # Normal+AO via Materialize sobre o albedo do atlas: mesma causa das
  # costuras (bordos das ilhas UV). O albedo/MR do paint ficam.
  pbr_enrich: false
