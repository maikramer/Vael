[package]
name = "vael_debugger_jackdaw"
version = "0.1.1"
edition = "2024"
rust-version = "1.97.1"
description = "Jackdaw extension: Vael debugger panel (play/pause/step/input)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/maikramer/Vael"
authors = ["Maikeu Locatelli"]
readme = "README.md"
publish = false

[workspace]

[package.metadata.jackdaw]
label = "Vael: Debugger"

[dependencies]
bevy = "0.20"
jackdaw_extension = "0.20"
jackdaw_api = "0.20"
bevy_ext_bridge_protocol = { path = "../../../bevy_extensions/crates/bevy_ext_bridge_protocol" }
serde_json = "1"
