[package]
name = "vael_mcp_jackdaw"
version = "0.1.2"
edition = "2024"
rust-version = "1.97.1"
description = "Jackdaw extension: Vael manipulation operators exposed to jd mcp"
license = "MIT OR Apache-2.0"
repository = "https://github.com/maikramer/Vael"
authors = ["Maikeu Locatelli"]
readme = "README.md"
publish = false

[workspace]

[package.metadata.jackdaw]
