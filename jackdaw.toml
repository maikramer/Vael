# jackdaw project settings.

# Optional name of your game's root Bevy Plugin (for setup / `jd doctor`).
plugin = "VaelPlugin"

# The workspace member jackdaw builds as the game.
package = "vael"

# Vael's AssetPlugin root: `/assets/...` resolves inside this folder.
assets_dir = "assets/public"

# Editor extensions enabled for this project (the bundle is installed
# globally by `jd extension install`).
[extensions]
bevy_ext_grass_jackdaw = true
bevy_voxel_terrain_jackdaw = true
vael_jackdaw = true
vael_content_jackdaw = true

# Recorded when this project was set up. Jackdaw compares these on
# open so an editor upgrade is reported instead of surfacing as a
# build failure.
[jackdaw]
version = "0.20.2"
bevy = "0.20"
channel = "stable"

# Optional jackdaw modules this project uses. Change them from the
# editor (File > Modules) so the game's Cargo.toml follows.
[modules]
physics = false
navmesh = false
multiplayer = false

# Play (o primeiro é o default do botão): directo ao mundo, sem cena de menu,
# véu nem prólogo — como `viber run --scene main --entry dev`. O jogo vai para
# o Game panel do editor (embedded) a não ser que o Play esteja em "janela
# separada" (`.jackdaw/settings.json` → `play.separate_window`).
[[run]]
name = "Play"
args = ["--scene", "main", "--entry", "dev"]

# O arranque de um jogador: cena de menu, título e prólogo.
[[run]]
name = "Play (título)"

# QA: o cenário activo (`tools/qa.py use <cenário>` escreve `qa/.active`)
# escolhe a cena, o estado (quests/itens/talentos), a hora e a posição. Gravar
# o JSON do cenário com o Play a correr reaplica-o (hot reload). Saves à parte.
[[run]]
name = "Play (QA)"
env = { VAEL_SCENARIO = "@active" }
