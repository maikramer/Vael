# config.yaml — contrato de paths do jogo com a engine (docs/ASSETS.md).
# Relativos a ESTA pasta. Obrigatório: o run/analyze não arranca sem ele.
title: Vael
# Preset da lente (docs/PERFORMANCE.md): alto | equilibrado | desempenho.
# `equilibrado` mantém sombras, relva e alcance; o post-FX abaixo corta só a
# lente que não se lê em movimento (o `desempenho` também cortaria o mundo).
graphics: equilibrado

# Post-FX por jogo (engine LÊ `postfx.disabled`; `VIBER_NO_*` ainda ganha).
# Fica o que dá resultado barato: tonemapping, bloom, exposição automática,
# SSAO Medium (assenta os objetos), CAS e TAA.
postfx:
  disabled:
    - volumetrics          # god-rays: ~6 ms de raymarch; quase não se lê a jogar
    - dof                  # desfoca o que o jogador precisa de ler
    - motion-blur          # com frame-time variável, a imagem "vibra"
    - contact-shadows      # subtil; o SSAO já faz o contacto com o chão
    - chromatic-aberration # firula de lente, retorno ~zero em gameplay
    - vignette             # idem
    - split-tone           # tinge os MIOLOS (poças) de azul: lê-se cinzento;
                           # a saturação do grading já separa o azul do quente
    - aerial               # nos planaltos altos (bosque 72 m, pilgrim 81 m,
                           # cidadela 189 m) o passe lia a distância errada e
                           # pintava o CHÃO inteiro de branco — o campanário
                           # e as ruínas pareciam flutuar num vazio. O fog de
                           # distância do céu continua a dar a profundidade.
  ssao: medium             # High (18 spp) → Medium (8 spp); o TAA limpa o ruído

# Reflexos de cena (SSR raster). `auto` segue o preset: `equilibrado` não paga
# o passe; `alto` liga-o. O chão molhado NÃO entra no raymarch — era o custo
# que aparecia quando chovia no mapa todo. O sheen de chão molhado continua
# barato no material do terreno (albedo escurecido + roughness 0.16).
# Para ter a água a refletir também no `equilibrado`, troca `mode` para `water`
# (água só, sem o chão).
reflections:
  mode: auto
  wet-ground: false
  steps: 16
  max-distance: 90

assets:
  # Roots extra, por ordem, DEPOIS da pasta do jogo (que é sempre a 1.ª —
  # overrides por-mundo e shaders/ especializados vivem lá).
  roots:
    - assets/public                    # pool deste jogo (manifests em assets/)
  bgm_dir: assets/audio/bgm              # <MusicLayer layer="x"> → {bgm_dir}/x.ogg
  sfx_dir: assets/audio/sfx              # clips da engine → {sfx_dir}/…
  terrain_textures_dir: assets/textures  # layers de terreno → {dir}/{alias}/…

game:
  scripts_dir: scripts                   # script="x.lua" + hot-reload

save:
  dir: ~/.local/share/viber              # {dir}/{mundo}.save.json (~ ok)

# Cenas (Unity/Godot): world.xml é a cena principal; scenes/**.xml são cenas próprias
# (universos separados — os interiores das casas). Autoloads = o que atravessa as cenas.
project:
  main-scene: world.xml
  start-scene: scenes/menu.xml   # 1.ª cena do run: o acampamento atrás do título
  scenes: scenes
  autoload:
    - world/autoload/player.xml
    - world/autoload/ui.xml
