[package]
name = "vael"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
# O jogo e os assets não vão para o crates.io; a distribuição é binário +
# pool. Os pacotes reutilizáveis vivem em `bevy_ext_*` (docs/PACKAGES.md).
publish = false

[workspace]
# O jogo é o membro por omissão (`default-members`): `cargo run`/`cargo test`
# na raiz não compilam o editor nem o Jackdaw. O editor constrói-se
# explicitamente com `-p vael-editor`; o conteúdo é partilhado por ambos.
members = ["content", "editor"]
default-members = ["."]
resolver = "3"

[features]
# Partículas GPU (protótipo): um efeito de brasas nas fogueiras, atrás de
# `VAEL_HANABI=1`. Default off para não pagar o pipeline no build normal.
hanabi = ["dep:bevy_hanabi"]

[dependencies]
anyhow = "1"
# CLI do arranque (a mesma stack/versão da engine; o lock unifica as
# features e não acrescenta pacotes novos).
clap = { version = "4.6", features = ["derive"] }
# O import do Jackdaw 0.20.x só aceita requirements que admitam a linha
# `0.20` (um pin `=0.20.1` é rejeitado); o lock continua a fixar 0.20.1.
# Mesma forma do `../Viber`, que o jogo compila por path-dep.
bevy = "0.20.1"
# Ambiente vivo (Bevy 0.20): sol/lua/estrelas astronómicos, clima, nuvens
# volumétricas, chuva/neve, névoa e relâmpagos. Substitui o `<Sky>`/`<DayCycle>`
# da engine no Vael; o terreno/água/biomas continuam a ser nossos.
bevy_elements = "0.8"
# Falas no mundo: balões (quads billboard) rasterizados na CPU, barks e um
# runtime de conversa. O crate fixa `bevy ^0.20` e o mesmo MSRV 1.97.1.
bevy_speech_bubbles = "0.3"
# Partículas GPU (Bevy 0.20): simulação/sorting no GPU, efeito de brasas.
# Opcional — o sistema CPU do Viber continua a ser o default.
bevy_hanabi = { version = "=0.20.0", default-features = false, features = ["3d"], optional = true }
# Relva GPU: o renderer `bevy_grass` e o bake de máscaras vivem no crate
# reutilizável `bevy_ext_grass` (crates/bevy_ext_grass no monorepo); o Vael
# fica só com o adaptador do terreno/biomas (`src/grass.rs`). A feature
# `avian` liga o trampling pelo collider do herói.
bevy_ext_grass = { path = "../bevy_extensions/crates/bevy_ext_grass" }
# Árvores procedurais (teste): meshes gerados em runtime a partir de presets,
# com LOD próprio (`TreeLod`). O crate fixa `bevy ^0.20`, a mesma versão da
# engine, por isso as features unificam sem duplicar o Bevy.
bevy_flora = "0.47"
# Luzes práticas (fogueiras/lanternas): pool orçamentado com histerese e
# cross-fade, flicker/fuel-bed e chama billboard. Mesmo Bevy (^0.20) e o
# mesmo MSRV 1.97.1. PIN EXATO de propósito: o crate tem semanas, o README
# declara-o "Vibe Coded" (sem revisão humana linha a linha) — subir de versão
# é uma decisão consciente, não um `cargo update`. Ver src/lights.rs e o gate
# `VAEL_PRACTICAL_LIGHTS`.
bevy_lights = "=0.5.0"
# UI do jogo: XAML/WPF-like sobre bevy_ui (bindings por reflexão, estilos,
# controlos e comandos). O crate alvo é bevy ^0.20; o Vael fixa 0.20.1.
bevy_pf = "0.5.2"
# Texto 3D do mundo (dano, cura, coleta, combo): quads com atlas de glifos,
# material próprio para o fade e billboard para a câmera. O crate fixa
# `bevy ^0.20`, a mesma versão da engine, por isso as features unificam.
bevy_rich_text3d = "0.8.1"
# Atributos/stats: grafo de dependências com expressões, modificadores e
# requisitos. O crate fixa `bevy ^0.20.1`, a mesma versão do Vael.
bevy_gauge = "0.6"
# Runtime do editor Jackdaw: descoberta de componentes (o `jd` lança o jogo
# com `--jackdaw-extract-schema`) e Play/PIE (`JACKDAW_PIE`). Sem PIE fica
# inerte. A versão acompanha o `jackdaw.toml` ([jackdaw] version = "0.20.2").
jackdaw_runtime = { version = "0.20", features = ["pie", "animation"] }
# Input do jogo avaliado pelo mesmo crate de acções do editor (`src/input.rs`):
# contextos, prioridades e consumo; o `ActionMap` da engine continua a ser a
# fonte dos binds.
jackdaw_input = "0.20"
# Métodos `jackdaw/*` no BRP do jogo (snapshot da cena, `entity_bsn`/
# `apply_bsn`, pause/step, diagnósticos): o debugger remoto do editor.
jackdaw_remote = "0.20"
# `SceneNodeId`: a chave das edições do Play (`src/editor_link.rs`).
jackdaw_scene_types = "0.20"
# Aplica os componentes autorados que o DSL não transporta (`editor_link`).
jackdaw_bsn = "0.20"
# Estados de animação autorados no editor (`src/animation.rs`).
jackdaw_animation_runtime = "0.20"
# Mesma versão/features do Viber (o Cargo unifica): a bridge do cofre mexe
# diretamente na tabela `viber_game` da VM partilhada.
mlua = { version = "0.12", features = ["luau", "vendored", "send"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Esquemas e validação do conteúdo (sem Bevy), partilhados com o editor.
vael-content = { path = "content" }
# Runtime de gameplay: o código do Viber mudou-se para o monorepo
# bevy_extensions como crate transitório. O alias `viber` preserva todos
# os imports `viber::` do jogo. TODO(viber-exit): dividir em pacotes finais.
viber = { package = "bevy_ext_viber_engine", path = "../bevy_extensions/crates/bevy_ext_viber_engine", features = ["ai"] }
# Runtime de debug/ferramentas: regista `viber-tools/*` no `bevy_remote` do
# jogo. O engine `viber` continua a ser o runtime de gameplay nesta fase.
viber_tools_runtime = { path = "../viber-tools/crates/viber_tools_runtime" }
# Save/load próprio do Vael: mundo refletido (recursos + componentes) em RON
# por slot. Substitui o `SavePlugin` do Viber quando `external_save: true`.
moonshine-save = "0.8" 
# Character controller do herói (o controller/collider nascem no spawner da
# engine; o movimento passa a ser nosso com `player_camera:false`).
# Avian + tnua: o corpo do herói é dinâmico e o tnua resolve o movimento.
avian3d = "0.8"
bevy-tnua = "0.33"
bevy-tnua-avian3d = "0.13"
# Definições autoradas na cena (`world/settings/*.bsn`, editadas no Jackdaw):
# o contrato partilhado com as extensões do editor. O `bevy_ext_world` é o
# mesmo crate que o Viber usa como `bevy_world_xml` (path igual, unifica).
bevy_ext_core = { path = "../bevy_extensions/crates/bevy_ext_core" }
bevy_ext_world = { path = "../bevy_extensions/crates/bevy_ext_world" }
bevy_ext_elements = { path = "../bevy_extensions/crates/bevy_ext_elements" }
bevy_ext_flora = { path = "../bevy_extensions/crates/bevy_ext_flora" }
bevy_ext_postfx = { path = "../bevy_extensions/crates/bevy_ext_postfx" }
bevy_ext_scene = { path = "../bevy_extensions/crates/bevy_ext_scene" }
# Sem `bevy_ext_ui`: a UI que a engine lê é a `viber::ui::*` (UiData,
# UiWriter, UiModalsOpen…), e o mesmo para `viber::camera::{ScriptCameraFree,
# CameraSnapshot}` e `viber::hud::markers::*`. A cópia do `bevy_ext_ui` era
# de tipos DIFERENTES (2026-11-14: importá-los deixava o HUD/modais/marcadores
# a escrever em recursos que ninguém lia); a wave C unificou a camada de dados
# no crate, mas o Vael continua pelos shims `viber::ui`.
bevy_ext_save = { path = "../bevy_extensions/crates/bevy_ext_save" }
# Glue do engine extraído: feedback, câmara de editor, camera-glue e HUD
# assets. Type-idêntico aos gémeos `viber::*` via re-export.
bevy_ext_engine = { path = "../bevy_extensions/crates/bevy_ext_engine" }
# Física extraída (plugin/colisores): type-idêntico a `viber::physics`.
bevy_ext_physics = { path = "../bevy_extensions/crates/bevy_ext_physics" }
# Render procedural dos objetos de primitivas (lathe/sweep/extruded/…): o
# contrato Shape/MaterialSpec vem do `bevy_ext_scene`; este crate troca o
# fallback do spawner pelo mesh/material/colisor exatos. `physics` liga os
# colisores Rapier exatos (trimesh para as formas procedurais).
bevy_ext_gradmesh = { path = "../bevy_extensions/crates/bevy_ext_gradmesh", features = ["physics"] }
# Usados directamente na composição da App (src/app.rs): os buses de áudio
# do runtime e o plugin das primitivas procedurais.
bevy_kira_audio = { version = "0.27.1", features = ["ogg"] }
bevy_gradmesh = "0.3.9"

# Perfil de desenvolvimento igual ao da engine: o jogo linka a engine inteira
# em cada binário de teste; debuginfo desempacotado e só line-tables mantêm o
# alvo em disco e as dependências otimizadas.
[profile.dev]
opt-level = 1
split-debuginfo = "unpacked"
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

# O `[patch]` do `bevy_ext_viber_engine` NÃO atravessa as path-deps: sem
# esta tabela o jogo (que compila o `viber` por path) resolveria o
# `rerecast` limpo do crates.io (0.5.1), enquanto a engine standalone e os
# testes dela usam o fork do vendor com os dois fixes de robustez
# (`../bevy_extensions/crates/bevy_ext_viber_engine/vendor/rerecast/VIBER_PATCH.md`).
# A navmesh do jogo mudaria de comportamento entre os dois builds. O vendor
# mudou-se do `../Viber` para o `bevy_extensions` (dono do runtime); é o
# mesmo patch da engine e não altera o código do sibling.

[patch.crates-io]
rerecast = { path = "../bevy_extensions/crates/bevy_ext_viber_engine/vendor/rerecast" }
