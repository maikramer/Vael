[package]
name = "vael-tools"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Ferramentas do mundo do Vael: analyze/lint/bsn, arranque e bridge de debug"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "vael_tools"
path = "src/lib.rs"

[[bin]]
name = "vael-tools"
path = "src/main.rs"

[dependencies]
jackdaw_bsn = "=0.20.2"
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bevy_ext_world = { path = "../../bevy_extensions/crates/bevy_ext_world", features = ["terrain"] }
bevy_ext_bridge_protocol = { path = "../../bevy_extensions/crates/bevy_ext_bridge_protocol" }
tempfile = "3"
